$kind: http-request
url: "{{baseUrl}}/api/books"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("Devuelve un arreglo", () => pm.expect(pm.response.json()).to.be.an("array"));
    language: text/javascript
order: 1000
